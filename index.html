function resize(){dpr=Math.min(2,window.devicePixelRatio||1);const r=canvas.getBoundingClientRect();canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);viewW=r.width;viewH=r.height;mini.width=290;mini.height=204;}
window.addEventListener('resize',resize);resize();
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nowTime(){const h=Math.floor(state.mins/60)%24,m=state.mins%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function addTime(n){state.mins+=n;if(state.mins>=1440){state.mins-=1440;state.day++}}
function save(showToast=true){localStorage.setItem(saveKey,JSON.stringify(state));if(showToast)toast('GAME SAVED')}
function load(){try{const s=JSON.parse(localStorage.getItem(saveKey));if(s)Object.assign(state,s)}catch(e){}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2200)}
function pct(a,b){return b?Math.round(a/b*100):0}
function overallScore(){const total=state.trainingCorrect+state.trainingWrong+state.radioCorrect+state.radioWrong+state.nurseCorrect+state.nurseWrong;const good=state.trainingCorrect+state.radioCorrect+state.nurseCorrect;return pct(good,total)}
function updateUI(){document.getElementById('fuel').textContent=Math.round(state.fuel)+'%';document.getElementById('money').textContent='$'+Math.round(state.money);document.getElementById('cond').textContent=Math.round(state.condition)+'%';document.getElementById('rep').textContent=state.rep;document.getElementById('calls').textContent=state.completed;document.getElementById('score').textContent=overallScore()+'%';document.getElementById('dayText').textContent='DAY '+state.day+' • '+nowTime();
let text='RETURN TO SOUTH COUNTY STATION';if(state.phase==='dispatched')text='DRIVE TO SCENE • '+(state.call?state.call.title:'ACTIVE CALL');if(state.phase==='scene')text='ON SCENE • COMPLETE PATIENT ASSESSMENT';if(state.phase==='transport')text='TRANSPORT TO HOSPITAL • RADIO REPORT REQUIRED';if(state.phase==='hospital')text='HOSPITAL • COMPLETE NURSE HANDOFF';if(state.phase==='return')text='RETURN TO SOUTH COUNTY STATION';if(state.phase==='refuel')text='DRIVE TO COUNTY FUEL STOP';document.getElementById('objective').innerHTML='<b>'+text+'</b>'+(state.target?'<br>'+distanceText():'');document.getElementById('code3').classList.toggle('on',state.code3);document.getElementById('dispatchBtn').textContent=state.phase==='ready'?'DISPATCH':state.phase==='return'?'RETURNING':'ACTIVE';document.getElementById('dispatchBtn').disabled=state.phase!=='ready';document.getElementById('refuelBtn').textContent=state.fuel<=1?'FUEL ASSIST':'REFUEL';document.getElementById('refuelBtn').disabled=!(state.phase==='ready'||state.phase==='return'||state.fuel<=1);}
function distanceText(){if(!state.target)return '';return Math.max(0,dist(state,state.target)/70).toFixed(1)+' MI'}
function openModal(html){document.getElementById('modalCard').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function startCall(){if(state.phase!=='ready')return;const sc=scenarios[Math.floor(Math.random()*scenarios.length)];const loc=scenes[Math.floor(Math.random()*scenes.length)];state.call=JSON.parse(JSON.stringify(sc));state.target={x:loc.x,y:loc.y,name:loc.name};state.phase='dispatched';state.code3=true;state.mode='ambulance';state.patient=null;state.questionIndex=0;state.reportMode=null;state.radioCorrect=0;state.radioWrong=0;state.nurseCorrect=0;state.nurseWrong=0;state.radioReportComplete=false;state.calls++;addTime(4);startSiren();updateUI();toast('DISPATCH: '+sc.title);}
function showDispatch(){openModal('<h1>DISPATCH</h1><p><b>'+state.call.title+'</b></p><p>'+state.call.dispatch+'</p><div class="tags"><span class="tag">CODE 3</span><span class="tag">EMT TRAINING</span><span class="tag">SCENE: '+state.target.name+'</span></div><p class="small">Drive to the yellow route and red scene marker. Lights and siren are active.</p><button class="btn good" onclick="closeModal()">ACKNOWLEDGE DISPATCH</button>')}
function sceneArrive(){if(state.phase!=='dispatched'||!state.target)return;if(dist(state,state.target)>65){toast('FOLLOW THE ROUTE TO THE SCENE');return}state.x=state.target.x;state.y=state.target.y;state.phase='scene';state.code3=false;stopSiren();state.patient={...state.call.v};updateUI();showQuestion();}
function showQuestion(){const q=state.call.questions[state.questionIndex];if(!q)return finishScenario();const [domain,question,options]=q;const order=options.map((_,i)=>i).sort(()=>Math.random()-.5);state._questionOptionMap=order;const opts=order.map((orig,i)=>'<button class="btn" onclick="answerQuestion('+i+')">'+String.fromCharCode(65+i)+'. '+options[orig]+'</button>').join('');openModal('<h2>SCENARIO '+(state.questionIndex+1)+' / '+state.call.questions.length+'</h2><div class="tags"><span class="tag">'+domain.toUpperCase()+'</span><span class="tag">PATIENT: '+state.call.v.age+' Y/O '+state.call.v.sex.toUpperCase()+'</span></div><p>'+question+'</p>'+opts+'<p class="small">Choose the best EMT action. Several choices may sound reasonable. Select the one that best addresses the immediate clinical priority and patient trend. Incorrect answers are recorded and the question is randomized again before retry.</p>')}
function answerQuestion(i){const q=state.call.questions[state.questionIndex];const actual=(state._questionOptionMap&&state._questionOptionMap[i]!==undefined)?state._questionOptionMap[i]:i;const correct=actual===q[3];if(correct){state.trainingCorrect++;openModal('<h2 class="goodText">CORRECT</h2><p>'+q[4]+'</p><button class="btn good" onclick="nextQuestion()">CONTINUE</button>')}else{state.trainingWrong++;openModal('<h2 class="badText">INCORRECT</h2><p><b>Not the best answer.</b> Reassess the patient priorities and try again.</p><button class="btn warn" onclick="showQuestion()">RETRY QUESTION</button>')}updateUI()}
function nextQuestion(){state.questionIndex++;showQuestion()}
function finishScenario(){state.phase='transport';state.target={x:hospital.x,y:hospital.y,name:'COUNTY HOSPITAL'};state.mode='ambulance';updateUI();openModal('<h1>PATIENT READY FOR TRANSPORT</h1><p>Assessment and treatment decisions are complete. You must now transport to County Hospital.</p><p class="warnText">The prehospital radio report is required before hospital arrival.</p><button class="btn warn" onclick="closeModal()">BEGIN TRANSPORT</button>')}
function hospitalArrive(){if(state.phase!=='transport'||dist(state,state.target)>80){toast('FOLLOW THE ROUTE TO COUNTY HOSPITAL');return}if(!state.radioReportComplete){toast('RADIO REPORT REQUIRED BEFORE HOSPITAL ARRIVAL');openRadioReport();return}state.x=hospital.x;state.y=hospital.y;state.phase='hospital';state.code3=false;stopSiren();updateUI();openNurseReport()}
const radioLabels=['Patient identification + age','Chief complaint + immediate severity','Key history / mechanism','Critical findings + current vitals','Treatment performed + response','Destination / ETA / immediate concern'];
const nurseLabels=['What happened before EMS arrival','Initial patient condition','Interventions performed','Response and reassessment trend','Current clinical priorities','Outstanding risks / what needs watching'];
function getReportItems(mode){return state.call.reports ? state.call.reports[mode] : state.call.report;}
function buildReportChoices(mode,index){
 const items=getReportItems(mode)||[];
 const correct=items[index]||state.call.report[index]||'Patient-specific information relevant to the transfer of care';
 // Plausible distractors come from this same patient's report, so the player must
 // choose the right clinical information for the requested radio/handoff element.
 const related=items.filter((item,j)=>j!==index);
 const nearMisses=mode==='radio' ? [
  'Give the original dispatch description only; omit the latest assessment and any change during transport.',
  'Report one reassuring measurement and call the patient stable without reconciling the other abnormal findings.',
  'List the interventions but leave out the patient’s response and current clinical status.'
 ] : [
  'Repeat the prearrival radio report verbatim without clarifying the initial-to-current clinical trend.',
  'Give only the latest vital signs and omit the initial severity, treatment timeline, and response.',
  'State that the patient improved and omit unresolved symptoms or risks that require continued monitoring.'
 ];
 const candidatePool=[...related,...nearMisses].filter(x=>x!==correct);
 const distractors=[];
 while(distractors.length<3 && candidatePool.length){
  const pick=Math.floor(Math.random()*candidatePool.length);
  const item=candidatePool.splice(pick,1)[0];
  if(!distractors.includes(item))distractors.push(item);
 }
 while(distractors.length<3)distractors.push(nearMisses[distractors.length%nearMisses.length]);
 const pool=[correct,...distractors];
 // Fisher-Yates shuffle avoids sort(Math.random()), which is biased and engine-dependent.
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 return pool;
}
function openRadioReport(){state.reportMode='radio';state.reportIndex=0;state.radioCorrect=0;state.radioWrong=0;showReportQuestion();}
function showReportQuestion(){
 const i=state.reportIndex, items=getReportItems('radio')||[];
 if(i>=items.length)return finishRadioReport();
 const opts=buildReportChoices('radio',i);state._reportOptions=opts;
 openModal('<h2>PREHOSPITAL RADIO REPORT</h2><div class="tags"><span class="tag">TRANSPORT NOTIFICATION</span><span class="tag">ITEM '+(i+1)+' / '+items.length+'</span></div><p><b>'+radioLabels[i]+'</b></p><p><b>Clinical communication challenge:</b> select the statement that best answers the requested report element. Distractors may contain true details from this case, but they do not answer this specific prompt. Prioritize a concise, accurate prearrival update.</p>'+opts.map((o,j)=>'<button class="btn" onclick="answerReport('+j+')">'+String.fromCharCode(65+j)+'. '+o+'</button>').join('')+'<p class="small">Radio reports should be brief, clinically focused, and useful for preparing the receiving team. You must complete all radio items before arrival.</p>');
}
function showNurseQuestion(){
 const i=state.reportIndex, items=getReportItems('nurse')||[];
 if(i>=items.length)return finishNurseReport();
 const opts=buildReportChoices('nurse',i);state._reportOptions=opts;
 openModal('<h2>NURSE HANDOFF</h2><div class="tags"><span class="tag">TRANSFER OF CARE</span><span class="tag">ITEM '+(i+1)+' / '+items.length+'</span></div><p><b>'+nurseLabels[i]+'</b></p><p><b>Transfer-of-care challenge:</b> select the statement that best answers this handoff element. Distinguish initial presentation from the latest reassessment, and identify treatment response or unresolved risk when relevant.</p>'+opts.map((o,j)=>'<button class="btn" onclick="answerReport('+j+')">'+String.fromCharCode(65+j)+'. '+o+'</button>').join('')+'<p class="small">This is different from the radio report: focus on what happened, what you did, how the patient responded, and what still requires attention.</p>');
}
function continueReport(){if(state.reportMode==='radio')showReportQuestion();else showNurseQuestion();}
function answerReport(i){
 const opts=state._reportOptions||[],selected=opts[i],items=getReportItems(state.reportMode)||[],expected=items[state.reportIndex];
 if(selected===expected){
  if(state.reportMode==='radio')state.radioCorrect++;else state.nurseCorrect++;
  state.reportIndex++;
  openModal('<h2 class="goodText">CORRECT</h2><p>That is the patient-specific information that belongs in this part of the report.</p><button class="btn good" onclick="continueReport()">CONTINUE</button>');
 }else{
  if(state.reportMode==='radio')state.radioWrong++;else state.nurseWrong++;
  openModal('<h2 class="badText">INCORRECT</h2><p><b>You are wrong.</b> Choose another option and try again.</p><p>The report needs patient-specific, clinically relevant information for this stage of care.</p>'+opts.map((o,j)=>'<button class="btn" onclick="answerReport('+j+')">'+String.fromCharCode(65+j)+'. '+o+'</button>').join(''));
 }
 updateUI();
}
function finishRadioReport(){
 const sc=pct(state.radioCorrect,state.radioCorrect+state.radioWrong);state.radioReportComplete=true;state.reportMode=null;
 openModal('<h1>RADIO REPORT COMPLETE</h1><div class="score">'+sc+'%</div><p>'+state.radioCorrect+' correct • '+state.radioWrong+' incorrect</p><p>The receiving facility has been notified. Continue to County Hospital. The nurse handoff will test transfer-of-care information separately.</p><button class="btn good" onclick="closeModal();updateUI()">CONTINUE TO HOSPITAL</button>');updateUI();
}
function openNurseReport(){state.reportMode='nurse';state.reportIndex=0;state.nurseCorrect=0;state.nurseWrong=0;showNurseQuestion();}
function finishNurseReport(){
 const sc=pct(state.nurseCorrect,state.nurseCorrect+state.nurseWrong);state.reportMode=null;state.phase='return';state.target={x:station.x,y:station.y,name:'SOUTH COUNTY STATION'};state.completed++;state.rep+=5;state.money+=(state.call.reward||75);addTime(18);
 const clinical=pct(state.trainingCorrect,state.trainingCorrect+state.trainingWrong),radio=pct(state.radioCorrect,state.radioCorrect+state.radioWrong);
 openModal('<h1>CALL COMPLETE</h1><div class="score">'+sc+'%</div><p><b>'+state.call.title+'</b></p><div class="tags"><span class="tag">Clinical decisions: '+clinical+'%</span><span class="tag">Radio report: '+radio+'%</span><span class="tag">Nurse handoff: '+sc+'%</span></div><p>Reward: $'+(state.call.reward||75)+' • Reputation: +5</p><p class="small">Radio performance measures concise pre-arrival notification. Nurse-handoff performance measures transfer-of-care communication, treatment response, reassessment and outstanding concerns. This simulation is educational and does not replace instructor evaluation, medical direction, current NREMT requirements or local protocols.</p><button class="btn good" onclick="closeModal();updateUI();save()">RETURN TO STATION</button>');updateUI();
}
function arriveAtTarget(){if(state.phase==='dispatched')sceneArrive();else if(state.phase==='transport')hospitalArrive();else if(state.phase==='refuel')completeRefuel();else if(state.phase==='return'){state.x=station.x;state.y=station.y;state.phase='ready';state.target=null;state.call=null;state.mode='station';updateUI();toast('BACK AT STATION • AVAILABLE FOR DISPATCH')}}
function requestRefuel(){
 if(state.fuel<=1 && dist(state,gasStation)>=100){
  const fee=50;state.money-=fee;state.fuel=20;addTime(12);toast('FUEL ASSIST: +20% RESERVE • $'+fee+' CHARGED');
  updateUI();save(false);return;
 }
 if(state.phase==='return'){toast('RETURN TO SOUTH COUNTY STATION FIRST');return;}
 if(state.phase!=='ready'){toast('FINISH THE ACTIVE CALL BEFORE REFUELING');return;}
 if(dist(state,gasStation)<100){completeRefuel();return;}
 if(state.fuel>=95){toast('TANK IS ALREADY NEARLY FULL');return;}
 state.phase='refuel';state.mode='ambulance';state.target={x:gasStation.x,y:gasStation.y,name:'COUNTY FUEL STOP'};state.code3=false;updateUI();toast('ROUTE SET: COUNTY FUEL STOP');
}
function completeRefuel(){
 if(state.phase!=='refuel' && dist(state,gasStation)>=100){toast('DRIVE TO COUNTY FUEL STOP');return;}
 state.x=gasStation.x;state.y=gasStation.y;const needed=Math.max(0,100-state.fuel);const cost=Math.ceil(needed*.45);state.money-=cost;state.fuel=100;addTime(5);state.phase='return';state.target={x:station.x,y:station.y,name:'SOUTH COUNTY STATION'};state.mode='ambulance';updateUI();save(false);openModal('<h1>REFUEL COMPLETE</h1><div class="score">100%</div><p>Tank filled at County Fuel Stop. Fuel charge: <b>$'+cost+'</b>. Available funds: <b>$'+Math.round(state.money)+'</b>.</p><p>Return to South County Station before accepting the next dispatch.</p><button class="btn good" onclick="closeModal()">RETURN TO STATION</button>');
}

let audio=null,osc=null,gain=null;function startSiren(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();osc=audio.createOscillator();gain=audio.createGain();osc.type='square';osc.frequency.value=620;gain.gain.value=.0001;osc.connect(gain).connect(audio.destination);osc.start()}audio.resume();gain.gain.setTargetAtTime(.035,audio.currentTime,.03);let hi=true;clearInterval(startSiren.t);startSiren.t=setInterval(()=>{if(!state.code3)return;osc.frequency.setValueAtTime(hi?620:470,audio.currentTime);hi=!hi},420)}function stopSiren(){if(gain&&audio){gain.gain.setTargetAtTime(.0001,audio.currentTime,.04)}clearInterval(startSiren.t)}

const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')closeModal()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joyActive=false,joyX=0,joyY=0;const joy=document.getElementById('joy'),stick=document.getElementById('stick');function joyMove(e){const r=joy.getBoundingClientRect();const p=e.touches?e.touches[0]:e;let dx=p.clientX-(r.left+r.width/2),dy=p.clientY-(r.top+r.height/2);const max=38,mag=Math.hypot(dx,dy)||1;if(mag>max){dx=dx/mag*max;dy=dy/mag*max}joyX=dx/max;joyY=dy/max;stick.style.transform='translate('+dx+'px,'+dy+'px)'}function joyEnd(){joyActive=false;joyX=joyY=0;stick.style.transform='translate(0,0)'}joy.addEventListener('touchstart',e=>{joyActive=true;joyMove(e)},{passive:false});joy.addEventListener('touchmove',e=>{e.preventDefault();joyMove(e)},{passive:false});joy.addEventListener('touchend',joyEnd);joy.addEventListener('touchcancel',joyEnd);

document.getElementById('dispatchBtn').onclick=()=>{if(state.phase==='ready')startCall()};document.getElementById('refuelBtn').onclick=requestRefuel;document.getElementById('reportBtn').onclick=()=>{if(state.phase==='transport')openRadioReport();else if(state.phase==='hospital')openNurseReport();else toast('REPORT IS AVAILABLE DURING TRANSPORT AND HANDOFF')};document.getElementById('saveBtn').onclick=save;document.getElementById('helpBtn').onclick=()=>openModal('<h1>HOW TO PLAY</h1><p>Drive the ambulance with the joystick or WASD/arrow keys. Follow the yellow route.</p><p>At the scene, answer EMT assessment and treatment questions. Wrong answers are recorded and you must retry the same decision.</p><p>During transport, complete the required prehospital radio report. At the hospital, complete the nurse handoff.</p><p>Fuel is consumed while driving. Use REFUEL to navigate to the marked County Fuel Stop, refill, pay the fuel charge, then return to the station before dispatch. If you run completely dry, FUEL ASSIST restores a small emergency reserve for a fee.</p><p>Code 3 activates emergency lights and siren. Browser audio may require your first tap to enable sound.</p><p class="small"><b>TRAINING NOTICE:</b> This is an educational simulation. It is not medical advice and does not replace an accredited EMT course, skills lab, medical direction, current NREMT guidance, Ohio EMS rules, or your local agency protocols.</p><button class="btn good" onclick="closeModal()">CLOSE</button>');document.getElementById('mapBtn').onclick=()=>toast('FOLLOW THE YELLOW ROUTE • RED = SCENE • BLUE = HOSPITAL • GREEN = STATION');

function drawRoad(x,y,w,h,vertical=false){ctx.fillStyle='#202622';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#465047';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);ctx.strokeStyle='#c4b96b';ctx.lineWidth=3;ctx.setLineDash([18,18]);if(vertical){ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.stroke()}else{ctx.beginPath();ctx.moveTo(x,y+h/2);ctx.lineTo(x+w,y+h/2);ctx.stroke()}ctx.setLineDash([])}
function building(x,y,w,h,label,type='building'){const colors={building:'#a2a08c',hospital:'#d7e0e4',station:'#6d9b70',school:'#d1b36f',fire:'#b96666',diner:'#b58d64',gas:'#d3bd5b',apartment:'#9388a7',industrial:'#777e82',farm:'#8b7651'};ctx.fillStyle='#172019';ctx.fillRect(x+7,y+7,w,h);ctx.fillStyle=colors[type]||colors.building;ctx.fillRect(x,y,w,h);ctx.strokeStyle='#1a211a';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);if(w>70){ctx.fillStyle='#152017';for(let xx=x+12;xx<x+w-8;xx+=28)ctx.fillRect(xx,y+10,12,9)}if(label){ctx.fillStyle='#f0f4e8';ctx.font='bold 14px monospace';ctx.fillText(label,x+4,y+h+17)}}
function tree(x,y,s=1){ctx.fillStyle='#17301c';ctx.fillRect(x-3,y+10*s,6,15*s);ctx.fillStyle='#315b34';ctx.fillRect(x-14*s,y-4*s,28*s,24*s);ctx.fillStyle='#3f6e3e';ctx.fillRect(x-9*s,y-10*s,18*s,12*s)}
function drawWorld(){ctx.fillStyle='#55784c';ctx.fillRect(0,0,W,H);ctx.fillStyle='#496b45';for(let y=0;y<H;y+=70){for(let x=(y/70%2)*35;x<W;x+=70){ctx.fillRect(x,y,2,2)}}
// clean road grid
 drawRoad(0,410,2400,90,false);drawRoad(0,1010,2400,90,false);drawRoad(0,1420,2400,72,false);drawRoad(320,0,82,1750,true);drawRoad(780,0,82,1750,true);drawRoad(1280,0,88,1750,true);drawRoad(1780,0,88,1750,true);drawRoad(2240,0,82,1750,true);
// lake
ctx.fillStyle='#4a88a0';ctx.fillRect(1830,0,410,330);ctx.fillStyle='#5f9cb2';for(let y=30;y<300;y+=35){ctx.fillRect(1860,y,150,3);ctx.fillRect(2070,y+12,120,3)}
// blocks and POIs
building(120,170,145,90,'FARM','farm');building(445,145,180,120,'PINE RD','building');building(910,145,180,120,'DINER','diner');building(1410,150,170,115,'SCHOOL','school');building(1920,430,210,130,'HOSPITAL','hospital');building(350,520,175,115,'STATION','station');building(1000,560,175,110,'MILL','industrial');building(1510,540,180,115,'FIRE','fire');building(2050,650,150,100,'GAS','gas');building(560,700,180,115,'APTS','apartment');building(850,770,180,105,'HARDWARE','building');building(1380,760,190,110,'BOWLING','diner');building(1750,780,190,110,'INDUSTRIAL','industrial');building(250,1160,190,115,'DINER','diner');building(580,1180,190,110,'SCHOOL','school');building(980,1170,210,125,'FAIR','building');building(1390,1160,190,110,'CLINIC','hospital');building(1830,1120,220,120,'WAREHOUSE','industrial');building(2070,1450,150,90,'FARM','farm');
for(let i=0;i<75;i++){const x=(i*197)%W,y=(i*113)%H;if((x>300&&x<2320)&&(y>380&&y<1490)&&((x%100)>35))tree(x,y,(i%3)+.7)}
// scene marker
if(state.target&&state.phase==='dispatched'){ctx.save();ctx.translate(state.target.x,state.target.y);const pulse=10+Math.sin(Date.now()/160)*5;ctx.strokeStyle='#ff4d4d';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,24+pulse,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ff4d4d';ctx.fillRect(-10,-10,20,20);ctx.fillStyle='#fff';ctx.font='bold 15px monospace';ctx.fillText('SCENE',-25,-34);ctx.restore()}
// route
if(state.target&&(state.phase==='dispatched'||state.phase==='transport'||state.phase==='return'||state.phase==='refuel')){ctx.save();ctx.strokeStyle='#ffe04d';ctx.lineWidth=7;ctx.setLineDash([18,12]);ctx.beginPath();ctx.moveTo(state.x,state.y);ctx.lineTo(state.target.x,state.target.y);ctx.stroke();ctx.restore()}
// station/hospital markers
marker(station.x,station.y,'STATION','#66e38a');marker(hospital.x,hospital.y,'HOSPITAL','#62a8ff');marker(gasStation.x,gasStation.y,'FUEL','#ffd45a');
// ambulance
if(state.mode==='ambulance'){ctx.save();ctx.translate(state.x,state.y);ctx.fillStyle='#e8e8df';ctx.fillRect(-24,-13,48,26);ctx.fillStyle='#d74242';ctx.fillRect(-24,-13,48,7);ctx.fillStyle='#18304a';ctx.fillRect(2,-9,15,10);ctx.fillStyle='#eee';ctx.fillRect(-18,-7,15,10);ctx.fillStyle='#d74242';ctx.fillRect(-6,-4,8,4);if(state.code3){ctx.fillStyle=Date.now()%600<300?'#ff3030':'#347dff';ctx.fillRect(-20,-20,13,5);ctx.fillStyle=Date.now()%600<300?'#347dff':'#ff3030';ctx.fillRect(8,-20,13,5)}ctx.restore()}
}
function marker(x,y,label,color){ctx.save();ctx.fillStyle=color;ctx.fillRect(x-7,y-7,14,14);ctx.strokeStyle='#101810';ctx.lineWidth=3;ctx.strokeRect(x-10,y-10,20,20);ctx.fillStyle='#f3f7ef';ctx.font='bold 13px monospace';ctx.fillText(label,x+14,y+5);ctx.restore()}
function camera(){const zoom=Math.max(.85,Math.min(1.25,Math.min(viewW/900,viewH/650)));const vw=viewW/zoom,vh=viewH/zoom;return{x:clamp(state.x,vw/2,W-vw/2),y:clamp(state.y,vh/2,H-vh/2),zoom}}
function draw(){const z=camera();ctx.clearRect(0,0,viewW,viewH);ctx.save();ctx.translate(viewW/2,viewH/2);ctx.scale(z.zoom,z.zoom);ctx.translate(-z.x,-z.y);drawWorld();ctx.restore();drawOffscreenArrow(z);drawMini();requestAnimationFrame(draw)}
function drawOffscreenArrow(z){if(!state.target)return;const sx=viewW/2+(state.target.x-z.x)*z.zoom,sy=viewH/2+(state.target.y-z.y)*z.zoom;if(sx>10&&sx<viewW-10&&sy>10&&sy<viewH-10)return;const cx=viewW/2,cy=viewH/2;const a=Math.atan2(sy-cy,sx-cx),r=Math.min(viewW,viewH)*.40;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#ffe04d';ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-10,-9);ctx.lineTo(-5,0);ctx.lineTo(-10,9);ctx.closePath();ctx.fill();ctx.restore()}
function drawMini(){mctx.fillStyle='#0c170e';mctx.fillRect(0,0,290,204);mctx.strokeStyle='#365039';mctx.lineWidth=2;for(let x=30;x<290;x+=45)mctx.strokeRect(x,0,1,204);for(let y=30;y<204;y+=40)mctx.strokeRect(0,y,290,1);function dot(p,c,s){mctx.fillStyle=c;mctx.fillRect(p.x/W*290-s/2,p.y/H*204-s/2,s,s)}dot(station,'#66e38a',7);dot(hospital,'#62a8ff',7);if(state.target)dot(state.target,'#ff6262',8);dot({x:state.x,y:state.y},'#fff',5);if(state.target){mctx.strokeStyle='#ffe04d';mctx.setLineDash([5,4]);mctx.beginPath();mctx.moveTo(state.x/W*290,state.y/H*204);mctx.lineTo(state.target.x/W*290,state.target.y/H*204);mctx.stroke();mctx.setLineDash([])}}

function move(){let x=joyX,y=joyY;if(keys.w||keys.arrowup)y=-1;if(keys.s||keys.arrowdown)y=1;if(keys.a||keys.arrowleft)x=-1;if(keys.d||keys.arrowright)x=1;const moving=Math.abs(x)+Math.abs(y)>0;if(moving&&state.mode==='ambulance'){if(state.fuel<=0){if(!move.fuelWarned){toast('OUT OF FUEL • USE FUEL ASSIST');move.fuelWarned=true}return;}move.fuelWarned=false;const sp=state.code3?5.0:3.5;state.x=clamp(state.x+x*sp,25,W-25);state.y=clamp(state.y+y*sp,25,H-25);state.fuel=Math.max(0,state.fuel-.025);state.condition=Math.max(0,state.condition-.0015);if(state.target&&dist(state,state.target)<70){arriveAtTarget()}}}
setInterval(()=>{move();updateUI()},50);
load();updateUI();draw();
window.addEventListener('beforeunload',save);
